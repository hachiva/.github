name: Bug report
description: Report an unexpected problem or incorrect behavior.
title: "[Bug]: "
labels:
  - bug
  - needs triage
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Please provide enough detail for the issue to be reproduced.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clearly describe the problem.
      placeholder: What happened, and what did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List the steps needed to reproduce the problem.
      placeholder: |
        1. Go to...
        2. Select...
        3. Observe...
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include the browser, operating system, application version, or relevant environment.
      placeholder: Chrome 150, macOS, version 1.0.0
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add screenshots, logs, or other relevant information.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched for an existing issue describing this problem.
          required: true
        - label: I have not included credentials, secrets, or sensitive information.
          required: true
