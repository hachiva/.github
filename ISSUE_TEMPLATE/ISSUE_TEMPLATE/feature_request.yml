name: Feature request
description: Suggest an improvement or new capability.
title: "[Feature]: "
labels:
  - enhancement
  - needs triage
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then explain the proposed solution.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or limitation should be addressed?
      placeholder: Describe the user need or workflow problem.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe how you think the problem could be solved.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any alternative solutions or workarounds.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add examples, screenshots, references, or related information.
    validations:
      required: false
